<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2430">Корона: ИК-приёмник и 3 кнопки</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#5b6675">Показано только назначение пинов, физическое расположение пинов на плате смотри по надписям на ней</text>

  <!-- ESP32-H2 -->
  <rect x="100" y="100" width="200" height="460" rx="10" fill="#e8f1ff" stroke="#2f5fb3" stroke-width="2"/>
  <text x="200" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2430">ESP32-H2</text>
  <text x="200" y="152" text-anchor="middle" font-size="13" fill="#1b2430">SuperMini</text>
  <g font-size="14" fill="#1b2430" text-anchor="end">
    <text x="284" y="175">3V3</text>
    <text x="284" y="235">GND</text>
    <text x="284" y="295">GPIO14</text>
    <text x="284" y="395">GPIO5</text>
    <text x="284" y="455">GPIO4</text>
    <text x="284" y="515">GPIO1</text>
  </g>

  <!-- ИК-приёмник -->
  <rect x="620" y="130" width="240" height="190" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="740" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2430">ИК-приёмник</text>
  <text x="740" y="176" text-anchor="middle" font-size="12" fill="#5b6675">3 вывода (VS1838 и аналоги)</text>
  <g font-size="14" fill="#1b2430">
    <text x="636" y="215">VCC</text>
    <text x="636" y="255">GND</text>
    <text x="636" y="295">OUT</text>
  </g>

  <!-- провода к ИК-приёмнику -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <polyline points="300,170 460,170 460,210 620,210" stroke="#d62d20"/>
    <polyline points="300,230 520,230 520,250 620,250" stroke="#1b2430"/>
    <polyline points="300,290 620,290" stroke="#1f8a3b"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="380" y="162" fill="#d62d20">питание 3.3 В</text>
    <text x="410" y="222" fill="#1b2430">земля</text>
    <text x="460" y="282" fill="#1f8a3b">сигнал</text>
  </g>

  <!-- кнопки -->
  <g fill="#eef7ee" stroke="#2f8a4a" stroke-width="2">
    <rect x="620" y="365" width="170" height="60" rx="8"/>
    <rect x="620" y="425" width="170" height="60" rx="8" transform="translate(0,5)"/>
    <rect x="620" y="485" width="170" height="60" rx="8" transform="translate(0,10)"/>
  </g>
  <g font-size="14" fill="#1b2430" text-anchor="middle">
    <text x="705" y="391" font-weight="bold">Кнопка 1</text>
    <text x="705" y="411" font-size="12" fill="#5b6675">вкл / выкл</text>
    <text x="705" y="456" font-weight="bold">Кнопка 2</text>
    <text x="705" y="476" font-size="12" fill="#5b6675">цвет / режим</text>
    <text x="705" y="516" font-weight="bold">Кнопка 3</text>
    <text x="705" y="536" font-size="12" fill="#5b6675">яркость</text>
  </g>

  <!-- провода к кнопкам -->
  <g stroke-width="3" stroke-linecap="round" fill="none" stroke="#1f8a3b">
    <polyline points="300,390 620,390"/>
    <polyline points="300,450 620,450"/>
    <polyline points="300,510 620,510"/>
  </g>
  <!-- общая земля кнопок -->
  <g stroke-width="3" stroke-linecap="round" fill="none" stroke="#1b2430">
    <polyline points="790,395 840,395 840,590"/>
    <polyline points="790,455 840,455"/>
    <polyline points="790,515 840,515"/>
  </g>
  <text x="840" y="612" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2430">GND</text>

  <text x="320" y="615" text-anchor="middle" font-size="13" fill="#5b6675">Кнопки замыкают пин на GND, внешние резисторы не нужны</text>
</svg>
